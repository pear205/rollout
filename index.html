<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6B4F">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘도 출동">
<title>오늘도 출동 — 영유아 외출 준비물</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root{
  --paper:#EDF0EC;
  --card:#FFFFFF;
  --ink:#17231C;
  --muted:#67766D;
  --line:#DDE3DC;
  --moss:#2F6B4F;
  --moss-soft:#E4EFE6;
  --sprout:#7FB069;
  --amber:#D98E2B;
  --amber-soft:#FBF0DC;
  --r:14px;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --num:"Space Grotesk",var(--sans);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;letter-spacing:-.01em;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 96px}

/* ---------- header ---------- */
.top{padding:22px 0 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.035em}
.top p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.ghost{
  background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:7px 13px;font-size:12.5px;font-family:inherit;
  font-weight:600;cursor:pointer;white-space:nowrap
}
.ghost:hover{border-color:var(--moss);color:var(--moss)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.eyebrow{
  font-family:var(--num);font-size:10.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:0 0 12px
}

/* ---------- form rows ---------- */
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none;padding-top:0}
.row>label{flex:0 0 62px;font-size:13px;font-weight:600;color:var(--muted)}
.row>.ctl{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input[type=text],input[type=date],input[type=time],input[type=number],select{
  font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper);
  border:1px solid transparent;border-radius:9px;padding:8px 10px;min-width:0;
}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.chip{
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  background:var(--paper);border:1px solid transparent;color:var(--muted);
  border-radius:999px;padding:7px 13px;transition:.14s
}
.chip[aria-pressed=true]{background:var(--moss);border-color:var(--moss);color:#fff}
.stepper{display:flex;align-items:center;gap:2px;background:var(--paper);border-radius:9px;padding:2px}
.stepper button{width:30px;height:30px;border:none;background:none;font-size:17px;color:var(--muted);cursor:pointer;font-family:var(--num)}
.stepper span{font-family:var(--num);font-weight:700;font-size:14px;min-width:44px;text-align:center}
.hint{font-size:12px;color:var(--muted)}

/* ---------- SIGNATURE: bag gauge ---------- */
.bag{
  position:sticky;top:0;z-index:20;margin:0 -16px 12px;padding:11px 16px;
  background:rgba(237,240,236,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)
}
.bag-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.bag-title{font-size:13px;font-weight:700}
.bag-count{font-family:var(--num);font-size:13px;font-weight:700;color:var(--moss)}
.bag-count em{font-style:normal;color:var(--muted);font-weight:500}
.track{height:9px;background:var(--card);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.fill{
  height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--sprout),var(--moss));
  transition:width .45s cubic-bezier(.22,1,.36,1)
}
.bag.done .fill{background:var(--moss)}
.bag-msg{margin-top:7px;font-size:12px;color:var(--muted)}
.bag.done .bag-msg{color:var(--moss);font-weight:600}

/* ---------- checklist ---------- */
.group{margin-bottom:6px}
.group-h{
  display:flex;align-items:baseline;gap:8px;padding:16px 2px 7px
}
.group-h b{font-size:14px;font-weight:700;letter-spacing:-.02em}
.group-h i{font-family:var(--num);font-style:normal;font-size:11px;color:var(--muted);font-weight:500}
.item{
  display:flex;align-items:flex-start;gap:11px;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:6px;
  cursor:pointer;transition:.14s
}
.item:hover{border-color:#c7d2c6}
.item.on{background:var(--moss-soft);border-color:#c7dfcb}
.box{
  flex:0 0 20px;height:20px;margin-top:1px;border:1.5px solid #B9C4BA;border-radius:6px;
  display:grid;place-items:center;transition:.14s
}
.item.on .box{background:var(--moss);border-color:var(--moss)}
.box svg{width:12px;height:12px;opacity:0;transform:scale(.6);transition:.16s}
.item.on .box svg{opacity:1;transform:scale(1)}
.item-body{flex:1;min-width:0}
.item-name{font-size:14.5px;font-weight:600;letter-spacing:-.02em}
.item.on .item-name{color:var(--moss)}
.item-why{font-size:12px;color:var(--muted);margin-top:2px}
.qty{
  flex:0 0 auto;font-family:var(--num);font-size:12.5px;font-weight:700;
  background:var(--paper);color:var(--ink);border-radius:7px;padding:4px 8px;margin-top:1px
}
.item.on .qty{background:#fff;color:var(--moss)}
.qty.warn{background:var(--amber-soft);color:var(--amber)}
.stock{opacity:.5}
.empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:13.5px}

/* ---------- presets / footer ---------- */
.preset{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 0;border-top:1px solid var(--line);cursor:pointer
}
.preset:first-of-type{border-top:none}
.preset-n{font-size:14px;font-weight:600}
.preset-d{font-size:12px;color:var(--muted)}
.stars{font-family:var(--num);font-size:12px;color:var(--amber);font-weight:700;white-space:nowrap}
.actions{display:flex;gap:8px;margin-top:14px}
.btn{
  flex:1;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
  border-radius:10px;padding:12px;border:1px solid var(--moss);
  background:var(--moss);color:#fff
}
.btn.alt{background:transparent;color:var(--moss)}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
  background:var(--ink);color:#fff;font-size:13px;font-weight:600;
  padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:60
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- in-app dialog — prompt()/confirm() 대체 ----------
   토스트(z-index:60)보다 위에 떠야 한다. 색·라운드·버튼은 전부 기존 토큰 재사용 */
.modal-back{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(23,35,28,.45);backdrop-filter:blur(3px)
}
.modal{width:100%;max-width:340px;margin:0;max-height:calc(100vh - 40px);overflow-y:auto}
/* publishKit 메시지에 줄바꿈이 들어 있어 pre-line이 필요하다 */
.modal-msg{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.02em;white-space:pre-line}
.modal-input{width:100%;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1>오늘도 출동</h1>
      <p>영유아 외출 준비물 — 오늘 챙길 것만 딱</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="ghost" id="btnAuth" hidden>구글로 로그인</button>
      <button class="ghost" id="btnProfile">아이 정보</button>
    </div>
  </div>

  <!-- 조건 입력 -->
  <section class="card" id="conditions">
    <p class="eyebrow">Briefing</p>

    <div class="row">
      <label for="birth">아이</label>
      <div class="ctl">
        <input type="date" id="birth" aria-label="생년월일">
        <span class="hint" id="ageOut">생년월일을 넣으면 월령이 계산돼요</span>
      </div>
    </div>

    <div class="row">
      <label for="start">출발</label>
      <div class="ctl">
        <input type="time" id="start" value="10:00">
        <div class="stepper">
          <button type="button" id="hMinus" aria-label="외출 시간 줄이기">−</button>
          <span id="hOut">3시간</span>
          <button type="button" id="hPlus" aria-label="외출 시간 늘리기">+</button>
        </div>
      </div>
    </div>

    <div class="row">
      <label>장소</label>
      <div class="ctl" id="places"></div>
    </div>

    <div class="row">
      <label>이동</label>
      <div class="ctl" id="transport"></div>
    </div>

    <div class="row">
      <label for="temp">날씨</label>
      <div class="ctl">
        <input type="number" id="temp" value="22" min="-20" max="45" style="width:70px" aria-label="기온">
        <span class="hint">℃</span>
        <div class="ctl" id="sky" style="flex:0 1 auto"></div>
      </div>
    </div>

    <div class="row">
      <label>수유</label>
      <div class="ctl" id="feeding"></div>
    </div>
  </section>

  <!-- 가방 게이지 -->
  <div class="bag" id="bag">
    <div class="bag-head">
      <span class="bag-title">보급품 점검</span>
      <span class="bag-count"><span id="cDone">0</span><em> / <span id="cAll">0</span></em></span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="bag-msg" id="bagMsg">출동 조건을 입력하면 목록이 만들어져요</div>
  </div>

  <div id="list"></div>

  <!-- 내 임무 — 로그인했을 때만 보인다 -->
  <section class="card" id="myKits" style="margin-top:20px" hidden>
    <p class="eyebrow">My Missions</p>
    <div id="kits"></div>
  </section>

  <!-- 프리셋 -->
  <section class="card" style="margin-top:20px">
    <p class="eyebrow">Missions</p>
    <div id="presets"></div>
    <div class="actions">
      <button class="btn alt" id="btnSave">이 임무 저장</button>
      <button class="btn" id="btnShare">임무 공유하기</button>
    </div>
    <div class="actions">
      <button class="btn alt" id="btnSaveKit">임무로 저장</button>
    </div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   0. Supabase 클라이언트
   publishable 키는 브라우저에 노출되는 게 정상이다. 방어선은 RLS다.
   CDN을 못 불러오면 sb가 null → 앱은 localStorage만으로 그대로 동작한다.
   ========================================================= */
const SB_URL = 'https://nzqydlttqrdyrtdgjmbg.supabase.co';
const SB_KEY = 'sb_publishable_FoR5K5gcyeGMggdjaiqZOA_o4Bj9u1z';
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;

let session  = null;   // 로그인 세션. null이면 전부 localStorage 경로
let nickname = '';     // profiles.nickname (버튼 라벨용)

/* =========================================================
   1. 저장소 어댑터
   로그인 O → profiles.settings (jsonb) / 로그인 X 또는 실패 → localStorage
   get(k)/set(k,v) 시그니처는 그대로. 앱의 나머지는 이걸 몰라도 된다.

   체크박스 하나 누를 때마다 render()+save()가 실행된다. 로그인 상태에서
   그때마다 profiles 테이블에 네트워크 쓰기를 보내면 연속 클릭에 렉·실패가
   난다 → localStorage는 매번 즉시 쓰고(안전망), 클라우드 쓰기만 묶어서
   (디바운스) 보낸다.
   ========================================================= */
async function localGet(k){
  try{
    if(window.storage){ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; }
    const v = localStorage.getItem(k); return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
async function localSet(k,v){
  try{
    if(window.storage){ await window.storage.set(k, JSON.stringify(v)); return; }
    localStorage.setItem(k, JSON.stringify(v));
  }catch(e){}
}

/* 클라우드(Supabase) 쓰기 — 실제 네트워크 호출은 이 함수 하나뿐이다.
   실패해도 조용히 넘어간다. 로컬에는 이미 저장돼 있으므로 다음 저장 때
   다시 시도된다. */
async function cloudSet(v){
  if(!(sb && session)) return;
  try{
    const uid = session.user.id;
    // profiles 행은 가입 시 트리거가 만들어 두므로 update가 정상 경로다.
    // (스키마상 authenticated에 insert 권한이 없어 upsert는 실패할 수 있다)
    const {data,error} = await sb.from('profiles')
      .update({settings:v}).eq('id', uid).select('id');
    if(error) throw error;
    if(!data || !data.length){          // 행이 없는 예외 상황에만 upsert 시도
      const r = await sb.from('profiles').upsert({id:uid, settings:v}).select('id');
      if(r.error) throw r.error;
    }
  }catch(e){ /* 실패해도 로컬 값은 남아 있다. 다음 save()에서 다시 시도된다 */ }
}

/* 클라우드 쓰기 디바운스. 이 앱은 실제로 키를 하나(KEY='rollout:v1')만
   쓰므로 슬롯 하나로 충분하다 — 연속 호출은 마지막 값만 살아남는다(coalesce). */
const CLOUD_SAVE_DELAY = 1200;
let cloudSaveTimer = null;
let cloudSavePending = null;   // 대기 중인 마지막 값. null이면 대기 없음

function scheduleCloudSave(v){
  cloudSavePending = v;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(flushCloudSave, CLOUD_SAVE_DELAY);
}
/* 대기 중인 클라우드 쓰기를 즉시 내보낸다. pagehide·화면 숨김·로그아웃
   직전에 호출한다. 페이지가 그 순간 닫혀도 로컬에는 이미 값이 남아 있으므로
   완료를 기다리지 않아도 된다(단, signOut 앞에서는 끝까지 기다린다). */
function flushCloudSave(){
  if(cloudSaveTimer!=null){ clearTimeout(cloudSaveTimer); cloudSaveTimer=null; }
  if(cloudSavePending===null) return Promise.resolve();
  const v=cloudSavePending; cloudSavePending=null;
  return cloudSet(v);
}

const Store = {
  async get(k){
    if(sb && session){
      try{
        const {data,error} = await sb.from('profiles')
          .select('nickname,settings').eq('id', session.user.id).maybeSingle();
        if(error) throw error;
        if(data){
          if(data.nickname) nickname = data.nickname;
          const s = data.settings;
          if(s && typeof s==='object' && Object.keys(s).length) return s;
        }
        return null;                       // 아직 클라우드에 저장된 게 없다
      }catch(e){ /* 네트워크·권한 문제 → 로컬로 폴백 */ }
    }
    return localGet(k);
  },
  async set(k,v){
    await localSet(k,v);                       // 즉시, 로그인 여부와 무관 — 안전망
    if(sb && session) scheduleCloudSave(v);     // 클라우드는 디바운스해서 보낸다
  }
};

/* =========================================================
   2. 규칙 엔진 — 앱의 심장. 아이템마다 조건 + 수량식을 붙인다
   ctx = {ageM, hours, startH, endH, temp, sky, places[], transport, feeding, month}
   ========================================================= */
const CATS = ['기저귀·위생','수유·식사','옷·체온','달래기','안전·응급','부모용'];
const nz = n => Math.max(1, Math.round(n));
const overlaps = (ctx,a,b) => ctx.startH < b && ctx.endH > a;   // 식사시간대와 겹치는지
const out = ctx => ctx.places.includes('야외');

/* 수량은 {value, unit} 구조로 다룬다. 계산·재계산·합산이 가능해야 하므로
   표시용 문자열을 만드는 건 이 함수 한 곳에서만 한다.
   value가 null이면 셀 수 없는 단위('파우치')라 단위만 보여준다. */
const fmtQty = q => q==null ? '' : (q.value==null ? q.unit : q.value+q.unit);

const ITEMS = [
  // ── 기저귀·위생
  {id:'diaper', c:0, n:'기저귀', when:c=>c.ageM<=36, warn:true,
   q:c=>({value:nz(c.hours/2)+2, unit:'장'}), why:c=>`2시간에 1장 + 여분 2장`},
  {id:'nightdiaper', c:0, n:'밤기저귀', when:c=>c.ageM<=36 && c.endH>=20, warn:true,
   q:()=>({value:1, unit:'장'}), why:()=>'귀가가 늦어요'},
  {id:'wipe', c:0, n:'물티슈', when:c=>c.ageM<=60, q:c=>({value:c.hours>4?2:1, unit:'팩'})},
  {id:'mat', c:0, n:'방수 기저귀 매트', when:c=>c.ageM<=24 && c.places.length>0},
  {id:'bag', c:0, n:'지퍼백 / 비닐봉투', q:()=>({value:3, unit:'장'}), why:()=>'오염된 옷·기저귀 담기'},
  {id:'sanit', c:0, n:'손 소독제', when:c=>c.places.includes('식당')||c.places.includes('실내놀이')},
  {id:'potty', c:0, n:'휴대용 변기커버', when:c=>c.ageM>=24 && c.ageM<=60, why:()=>'배변 가리는 시기'},

  // ── 수유·식사
  {id:'bottle', c:1, n:'젖병', when:c=>c.ageM<=15 && c.feeding!=='모유', q:c=>({value:Math.min(3,nz(c.hours/3.5)), unit:'개'})},
  {id:'formula', c:1, n:'분유 포션', when:c=>c.ageM<=15 && c.feeding!=='모유', q:c=>({value:nz(c.hours/3.5), unit:'회분'})},
  {id:'thermos', c:1, n:'보온병(따뜻한 물)', when:c=>c.ageM<=15 && c.feeding!=='모유'},
  {id:'cover', c:1, n:'수유 가리개', when:c=>c.feeding!=='분유' && c.ageM<=15 && c.places.length>0},
  {id:'babyfood', c:1, n:'이유식 + 스푼', when:c=>c.ageM>=6 && c.ageM<=18 && (overlaps(c,11,13.5)||overlaps(c,17,19.5)),

  birth:'', startT:'10:00', hours:3, temp:22, sky:'맑음',

  // 저장된 임무를 불러오면 그때의 개월수를 여기 고정한다. 생년월일을 직접
  // 고치면 다시 null이 되고, 계산된 월령이 우선한다.
  ageOverride:null,

};

const $ = s => document.querySelector(s);
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function ageMonths(){
  if(!S.birth) return null;
  const b=new Date(S.birth), n=new Date();
  return Math.max(0,(n.getFullYear()-b.getFullYear())*12 + (n.getMonth()-b.getMonth()) - (n.getDate()<b.getDate()?1:0));
}
const fmtAge = a => a>=24 ? `만 ${Math.floor(a/12)}세 ${a%12}개월` : `${a}개월`;
function ctx(){
  const [h,m]=S.startT.split(':').map(Number);
  const sh=h+m/60;
  return {ageM:S.ageOverride ?? ageMonths() ?? 12, hours:S.hours, startH:sh, endH:sh+S.hours,
          temp:+S.temp, sky:S.sky, places:S.places, transport:S.transport,
          feeding:S.feeding, month:new Date().getMonth()+1};
}

/* =========================================================
   3-B. 인앱 다이얼로그 — prompt()/confirm() 대체
   모바일 브라우저·인앱 브라우저(카카오톡·네이버 등)·PWA standalone에서는
   window.prompt()/confirm()이 에러 없이 조용히 차단되거나 즉시 null을 준다.
   그래서 사용자에겐 "버튼이 죽은 것"처럼 보였다 → 직접 그린다.
     askText(msg, def) → Promise<string|null>  (취소 null — prompt와 동일한 계약)
     askConfirm(msg)   → Promise<boolean>
   ========================================================= */
function openDialog(message, withInput, defaultValue){
  return new Promise(resolve=>{
    const back=document.createElement('div');
    back.className='modal-back';
    back.setAttribute('role','dialog');
    back.setAttribute('aria-modal','true');

    const card=document.createElement('div');
    card.className='card modal';

    const msg=document.createElement('p');
    msg.className='modal-msg';
    msg.id='dlgMsg';
    msg.textContent=message;                 // textContent — 사용자 문구가 들어와도 안전하다
    back.setAttribute('aria-labelledby','dlgMsg');
    card.appendChild(msg);

    let input=null;
    if(withInput){
      input=document.createElement('input');
      input.type='text';
      input.className='modal-input';
      input.value = defaultValue==null ? '' : String(defaultValue);
      card.appendChild(input);
    }

    const acts=document.createElement('div'); acts.className='actions';
    const cancel=document.createElement('button');
    cancel.type='button'; cancel.className='btn alt'; cancel.textContent='취소';
    const ok=document.createElement('button');
    ok.type='button'; ok.className='btn'; ok.textContent='확인';
    acts.appendChild(cancel); acts.appendChild(ok);
    card.appendChild(acts);
    back.appendChild(card);

    const prevOverflow=document.body.style.overflow;
    const prevFocus=document.activeElement;
    let closed=false;

    function close(v){
      if(closed) return;
      closed=true;
      document.removeEventListener('keydown', onKey, true);
      back.remove();
      document.body.style.overflow=prevOverflow;
      try{ if(prevFocus && prevFocus.focus) prevFocus.focus(); }catch(e){}
      resolve(v);
    }
    // 취소 시 prompt는 null, confirm은 false — 네이티브 계약을 그대로 지킨다
    const accept=()=>close(withInput ? input.value : true);
    const reject=()=>close(withInput ? null : false);

    function onKey(e){
      if(e.key==='Escape'){ e.preventDefault(); reject(); return; }
      if(e.key==='Enter' && withInput && e.target===input){ e.preventDefault(); accept(); return; }
      if(e.key==='Tab'){                       // 포커스가 모달 밖으로 새지 않게
        const f=[input,cancel,ok].filter(Boolean);
        const i=f.indexOf(document.activeElement);
        if(i<0){ e.preventDefault(); f[0].focus(); return; }
        const n=e.shiftKey ? (i-1+f.length)%f.length : (i+1)%f.length;
        e.preventDefault(); f[n].focus();
      }
    }
    ok.onclick=accept;
    cancel.onclick=reject;
    back.onclick=e=>{ if(e.target===back) reject(); };   // 바깥 탭 = 취소
    document.addEventListener('keydown', onKey, true);

    document.body.appendChild(back);
    document.body.style.overflow='hidden';
    // 입력이 있으면 바로 타이핑할 수 있게 입력창에 포커스(네이티브 prompt와 같은 감각),
    // 확인 다이얼로그는 확인 버튼에 포커스
    if(input){ input.focus(); input.select(); } else { ok.focus(); }
  });
}
const askText    = (message, defaultValue) => openDialog(message, true, defaultValue);
const askConfirm = message => openDialog(message, false);

function chipGroup(el, opts, get, set, multi){
  el.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.type='button'; b.className='chip'; b.textContent=o;
    const on = multi ? get().includes(o) : get()===o;
    b.setAttribute('aria-pressed', on);
    b.onclick=()=>{
      if(multi){
        const v=get(); const i=v.indexOf(o);
        i<0 ? v.push(o) : v.splice(i,1);
        set(v);
      } else set(o);
      render(); save();
    };
    el.appendChild(b);
  });
}

function renderForm(){
  $('#birth').value=S.birth; $('#start').value=S.startT; $('#temp').value=S.temp;
  $('#hOut').textContent=S.hours+'시간';
  const a = S.ageOverride ?? ageMonths();
  $('#ageOut').textContent = a==null ? '생년월일을 넣으면 월령이 계산돼요'
    : fmtAge(a) + (S.ageOverride!=null ? ' · 저장된 임무 기준' : '');
  chipGroup($('#places'),PLACES,()=>S.places,v=>S.places=v,true);
  chipGroup($('#transport'),TRANSPORT,()=>S.transport,v=>S.transport=v);
  chipGroup($('#sky'),SKY,()=>S.sky,v=>S.sky=v);
  chipGroup($('#feeding'),FEEDING,()=>S.feeding,v=>S.feeding=v);
}

function renderList(){
  const c=ctx();
  const hit = ITEMS.filter(i=>!i.when || i.when(c));
  const box=$('#list'); box.innerHTML='';

  if(!hit.length){ box.innerHTML='<div class="empty">출동 조건을 알려주세요</div>'; return; }

  CATS.forEach((cat,ci)=>{
    const rows=hit.filter(i=>i.c===ci);
    if(!rows.length) return;
    const g=document.createElement('div'); g.className='group';
    const h=document.createElement('div'); h.className='group-h';
    h.innerHTML=`<b>${cat}</b><i>${rows.length}</i>`;
    g.appendChild(h);

    rows.forEach(it=>{
      const on=!!S.checked[it.id], stk=!!S.stock[it.id];
      const el=document.createElement('div');
      el.className='item'+(on?' on':'')+(stk?' stock':'');
      el.setAttribute('role','checkbox');
      el.setAttribute('aria-checked',on);
      el.tabIndex=0;
      const q=it.q?it.q(c):null;
      const why=it.why?it.why(c):null;
      el.innerHTML=`
        <div class="box"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2 4.6 8.8 10 3.4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="item-body">
          <div class="item-name">${it.n}</div>
          ${why?`<div class="item-why">${why}</div>`:''}
        </div>
        ${q?`<span class="qty${it.warn?' warn':''}">${fmtQty(q)}</span>`:''}`;
      const flip=()=>{ S.checked[it.id]=!S.checked[it.id]; render(); save(); };
      el.onclick=flip;
      el.onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flip(); } };
      g.appendChild(el);
    });
    box.appendChild(g);
  });

  // 게이지
  const done=hit.filter(i=>S.checked[i.id]).length;
  $('#cDone').textContent=done; $('#cAll').textContent=hit.length;
  $('#fill').style.width=(hit.length?done/hit.length*100:0)+'%';
  const bag=$('#bag'), left=hit.length-done;
  bag.classList.toggle('done', left===0);
  $('#bagMsg').textContent = left===0 ? '대장님 출동 준비 끝! 조심히 다녀오세요' : `보급품 ${left}개 남았어요`;
}

const render=()=>{ renderForm(); renderList(); };

/* =========================================================
   5. 공유 — 서버 없이 URL 해시로 킷 전달 (MVP 단계용)
   ========================================================= */
function encode(){
  const p={b:S.birth,s:S.startT,h:S.hours,t:S.temp,k:S.sky,pl:S.places,tr:S.transport,f:S.feeding};
  return btoa(encodeURIComponent(JSON.stringify(p)));
}
function decode(str){
  try{
    const p=JSON.parse(decodeURIComponent(atob(str)));
    Object.assign(S,{birth:p.b,startT:p.s,hours:p.h,temp:p.t,sky:p.k,places:p.pl,transport:p.tr,feeding:p.f});
    return true;
  }catch(e){ return false; }
}

/* =========================================================
   6-B. 내 임무 — kits 테이블. 로그인한 본인 것만 (RLS가 보장)
   ========================================================= */
let myKits = [];

/* 조건 요약 한 줄 — 카드 보조 텍스트와 저장 이름 기본값에 쓴다 */
function kitSummary(c){
  if(!c) return '';
  const b=[];
  if(c.ageM!=null) b.push(fmtAge(+c.ageM));
  if(Array.isArray(c.places)&&c.places.length) b.push(c.places.join('·'));
  if(c.hours!=null) b.push(c.hours+'시간');
  if(c.temp!=null&&c.temp!=='') b.push(c.temp+'℃');
  return b.join(' · ');
}

function renderKits(){
  const sec=$('#myKits'), box=$('#kits');
  if(!sb || !session){ sec.hidden=true; box.innerHTML=''; return; }
  sec.hidden=false;
  box.innerHTML='';

  if(!myKits.length){
    box.innerHTML='<div class="preset-d">아직 저장한 임무가 없어요. 조건을 맞춘 뒤 ‘임무로 저장’을 눌러보세요</div>';
    return;
  }

  myKits.forEach(k=>{
    const el=document.createElement('div');
    el.className='preset'; el.tabIndex=0; el.setAttribute('role','button');
    const sub = k.description || kitSummary(k.conditions)
              || new Date(k.created_at).toLocaleDateString('ko-KR');
    el.innerHTML=`<div><div class="preset-n">${esc(k.title)}</div><div class="preset-d">${esc(sub)}</div></div>`;

    // 공개 전환은 되돌릴 수 없다(이번 범위에선 비공개로 되돌리는 기능이 없다)
    // → 이미 공개된 킷은 버튼 대신 상태 표시만 남긴다
    if(k.is_public){
      const tag=document.createElement('span');
      tag.className='preset-d'; tag.textContent='공개됨';
      tag.style.whiteSpace='nowrap';
      el.appendChild(tag);
    }else{
      const pub=document.createElement('button');
      pub.type='button'; pub.className='ghost'; pub.textContent='공개하기';
      pub.style.padding='4px 11px';
      pub.setAttribute('aria-label', k.title+' 공개하기');
      pub.onclick=e=>{ e.stopPropagation(); publishKit(k); };
      pub.onkeydown=e=>{ e.stopPropagation(); };
      el.appendChild(pub);
    }

    const del=document.createElement('button');
    del.type='button'; del.className='ghost'; del.textContent='×';
    del.style.padding='4px 11px';
    del.setAttribute('aria-label', k.title+' 삭제');
    del.onclick=e=>{ e.stopPropagation(); removeKit(k); };
    del.onkeydown=e=>{ e.stopPropagation(); };
    el.appendChild(del);

    const apply=()=>applyKit(k);
    el.onclick=apply;
    el.onkeydown=e=>{ if(e.key==='Enter'){ apply(); } };
    box.appendChild(el);
  });
}

async function loadKits(){
  if(!sb || !session){ myKits=[]; renderKits(); return; }
  try{
    const {data,error}=await sb.from('kits')
      .select('id,title,description,conditions,is_public,created_at')
      .eq('owner_id', session.user.id)
      .order('created_at',{ascending:false});
    if(error) throw error;
    myKits=data||[];
  }catch(e){
    console.error('임무 목록 불러오기 실패', e);
    myKits=[];
  }
  renderKits();
}

/* 저장된 조건을 그대로 재현한다. 개월수는 저장 시점 값으로 고정 */
function applyKit(k){
  const c=k.conditions||{};
  S.ageOverride = (c.ageM==null ? null : +c.ageM);
  Object.assign(S,{
    startT:    c.startT || S.startT,
    hours:     c.hours!=null ? +c.hours : S.hours,
    temp:      c.temp!=null&&c.temp!=='' ? +c.temp : S.temp,
    sky:       c.sky || S.sky,
    places:    Array.isArray(c.places) ? c.places.slice() : S.places,
    transport: c.transport || S.transport,
    feeding:   c.feeding || S.feeding
  });
  S.checked={};
  render(); save();
  toast('임무를 불러왔어요');
  window.scrollTo({top:0,behavior:'smooth'});
}

async function saveKit(){
  if(!sb || !session){ toast('로그인하면 임무를 저장할 수 있어요'); return; }
  const c=ctx();
  const suggest=(S.places.length ? S.places.join('·') : '오늘')+' 출동';
  const raw=await askText('임무 이름을 알려주세요', suggest);
  if(raw===null) return;                       // 취소
  const title=raw.trim();
  if(!title){ toast('임무 이름을 적어주세요'); return; }
  if(title.length>60){ toast('임무 이름은 60자까지예요'); return; }

  // qty는 {value,unit} 구조로 저장한다. 문자열로 굳혀 두면 나중에 재계산·수정·합산을 못 한다.
  const items=ITEMS.filter(i=>!i.when||i.when(c))
                   .map(i=>({id:i.id, name:i.n, qty:i.q?i.q(c):null}));
  try{
    const {error}=await sb.from('kits').insert({
      owner_id: session.user.id,
      title,
      conditions:{ageM:c.ageM, hours:S.hours, startT:S.startT, temp:+S.temp,
                  sky:S.sky, places:S.places, transport:S.transport, feeding:S.feeding},
      items,
      is_public:false
    });
    if(error) throw error;
    toast('임무를 저장했어요');
    await loadKits();
  }catch(e){
    console.error('임무 저장 실패', e);
    toast('임무를 저장하지 못했어요');
  }
}

async function removeKit(k){
  if(!sb || !session) return;
  if(!(await askConfirm(`‘${k.title}’ 임무를 지울까요?`))) return;
  try{
    const {error}=await sb.from('kits').delete().eq('id', k.id);
    if(error) throw error;
    toast('임무를 지웠어요');
    await loadKits();
  }catch(e){
    console.error('임무 삭제 실패', e);
    toast('임무를 지우지 못했어요');
  }
}

/* 내 임무를 공개로 전환. 공개해야만 다른 부모가 보고 별점을 줄 수 있다.
   RLS의 "내 킷만 수정" 정책이 남의 킷 공개를 막아준다. */
async function publishKit(k){
  if(!sb || !session) return;
  if(!(await askConfirm(`‘${k.title}’ 임무를 공개할까요?\n다른 부모가 보고 별점을 줄 수 있어요. 되돌리려면 임무를 지워야 해요.`))) return;
  try{
    const {error}=await sb.from('kits').update({is_public:true}).eq('id', k.id);
    if(error) throw error;
    toast('임무를 공개했어요');
    await loadKits();
    await loadPublicKits();        // 방금 공개한 킷이 아래 목록에도 나타나야 한다
  }catch(e){
    console.error('임무 공개 실패', e);
    toast('임무를 공개하지 못했어요');
  }
}

/* =========================================================
   6-C. 공개 임무 + 별점 — kits_with_author 뷰 (비로그인도 읽을 수 있다)
   공개 임무가 0개면 하드코딩 PRESETS로 폴백한다(콜드스타트).
   둘을 섞지 않는다 — "예시"와 "진짜"의 구분이 흐려진다.
   ========================================================= */
let pubKits   = [];
let myRatings = {};   // kit_id → 내가 준 점수. 별을 채워 보여주는 용도

async function loadPublicKits(){
  if(!sb){ pubKits=[]; myRatings={}; renderPublicKits(); return; }
  try{
    const {data,error}=await sb.from('kits_with_author')
      .select('*')
      .order('rating_avg',{ascending:false})
      .order('rating_count',{ascending:false})
      .limit(20);
    if(error) throw error;
    pubKits=data||[];
  }catch(e){
    console.error('공개 임무 불러오기 실패', e);
    pubKits=[];
  }

  myRatings={};
  if(session && pubKits.length){
    try{
      const {data,error}=await sb.from('ratings')
        .select('kit_id,score')
        .eq('user_id', session.user.id)
        .in('kit_id', pubKits.map(k=>k.id));
      if(error) throw error;
      (data||[]).forEach(r=>{ myRatings[r.kit_id]=r.score; });
    }catch(e){ console.error('내 별점 불러오기 실패', e); }
  }
  renderPublicKits();
}

function renderPublicKits(){
  if(!pubKits.length){ renderPresets(); return; }   // 콜드스타트 폴백
  const box=$('#presets'); box.innerHTML='';

  pubKits.forEach(k=>{
    const el=document.createElement('div');
    el.className='preset'; el.tabIndex=0; el.setAttribute('role','button');

    const sub=[k.description || kitSummary(k.conditions), k.author]
              .filter(Boolean).join(' · ');
    const body=document.createElement('div');
    body.innerHTML=`<div class="preset-n">${esc(k.title)}</div><div class="preset-d">${esc(sub)}</div>`;
    el.appendChild(body);
    el.appendChild(ratingBox(k));

    const apply=()=>applyKit(k);      // conditions 구조가 내 임무와 같아 그대로 재사용
    el.onclick=apply;
    el.onkeydown=e=>{ if(e.key==='Enter'){ apply(); } };
    box.appendChild(el);
  });
}

/* 평균 별점 + (본인 킷이 아니면) 별점 입력 */
function ratingBox(k){
  const wrap=document.createElement('div');
  wrap.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto';

  const avg=document.createElement('span');
  avg.className='stars';
  avg.innerHTML = k.rating_count>0
    ? `★ ${Number(k.rating_avg).toFixed(1)} <em style="font-style:normal;color:var(--muted);font-weight:500">(${k.rating_count})</em>`
    : `<em style="font-style:normal;color:var(--muted);font-weight:500">아직 별점 없음</em>`;
  wrap.appendChild(avg);

  // 본인이 올린 공개 킷에는 입력을 아예 띄우지 않는다 — RLS가 어차피 막는다
  const mine = session && session.user && k.owner_id===session.user.id;
  if(!mine) wrap.appendChild(starPicker(k));
  return wrap;
}

function starPicker(k){
  const p=document.createElement('div');
  p.className='stars';
  p.style.cssText='display:flex;gap:1px';
  const my=myRatings[k.id]||0;
  for(let n=1;n<=5;n++){
    const b=document.createElement('button');
    b.type='button'; b.textContent='★';
    b.style.cssText='background:none;border:none;padding:0 1px;line-height:1;'
      +'font-family:inherit;font-size:14px;cursor:pointer;color:'
      +(n<=my ? 'var(--amber)' : 'var(--line)');
    b.setAttribute('aria-label', k.title+' 별점 '+n+'점');
    // 카드 클릭(임무 불러오기)이 같이 실행되지 않도록 반드시 막는다
    b.onclick=e=>{ e.stopPropagation(); rateKit(k,n); };
    b.onkeydown=e=>{ e.stopPropagation(); };
    p.appendChild(b);
  }
  return p;
}

async function rateKit(k,score){
  if(!sb || !session){ toast('로그인하면 별점을 남길 수 있어요'); return; }
  const uid=session.user.id;
  if(k.owner_id===uid){ toast('내가 올린 임무에는 별점을 줄 수 없어요'); return; }
  try{
    // (kit_id,user_id)가 PK라 한 사람당 한 표. 이미 줬으면 갱신한다
    const {data,error}=await sb.from('ratings')
      .select('score').eq('kit_id',k.id).eq('user_id',uid).maybeSingle();
    if(error) throw error;
    const r = data
      ? await sb.from('ratings').update({score}).eq('kit_id',k.id).eq('user_id',uid)
      : await sb.from('ratings').insert({kit_id:k.id, user_id:uid, score});
    if(r.error) throw r.error;
    myRatings[k.id]=score;
    toast('별점을 남겼어요');
    await loadPublicKits();          // 갱신된 평균·개수를 다시 받아온다
  }catch(e){
    // 그 사이 킷이 비공개로 바뀌는 등 RLS가 막는 경우
    console.error('별점 저장 실패', e);
    toast('별점을 남기지 못했어요');
  }
}

/* =========================================================
   7. 배선
   ========================================================= */
const KEY='rollout:v1';
const save=()=>Store.set(KEY,S);

/* 로그인 버튼 — 기능 라벨이므로 평범한 말로 */
function renderAuth(){
  const b=$('#btnAuth');
  if(!sb){ b.hidden=true; return; }
  b.hidden=false;
  if(session){
    const name = nickname && (nickname.length>8 ? nickname.slice(0,8)+'…' : nickname);
    b.textContent = name || '로그아웃';
    b.title = '로그아웃';
  }else{
    b.textContent = '구글로 로그인';
    b.title = '구글 계정으로 로그인';
  }
}
$('#btnAuth').onclick=async()=>{
  if(!sb) return;
  if(session){
    await flushCloudSave();   // 로그아웃으로 세션이 사라지기 전에 대기 중인 쓰기를 내보낸다
    await sb.auth.signOut();
  }else{
    const {error}=await sb.auth.signInWithOAuth({
      provider:'google',
      options:{redirectTo: location.origin+location.pathname}
    });
    if(error) toast('로그인을 시작하지 못했어요');
  }
};

/* 생년월일을 직접 고치면 저장된 임무의 개월수 고정을 푼다 (직접 입력이 우선) */
$('#birth').onchange=e=>{S.birth=e.target.value;S.ageOverride=null;render();save();};
$('#start').onchange=e=>{S.startT=e.target.value;render();save();};
$('#temp').oninput=e=>{S.temp=e.target.value;render();save();};
$('#hMinus').onclick=()=>{S.hours=Math.max(1,S.hours-1);render();save();};
$('#hPlus').onclick=()=>{S.hours=Math.min(12,S.hours+1);render();save();};
$('#btnProfile').onclick=()=>{ $('#birth').focus(); window.scrollTo({top:0,behavior:'smooth'}); };
$('#btnSave').onclick=async()=>{ await save(); toast('이 임무를 저장했어요'); };
$('#btnSaveKit').onclick=saveKit;
$('#btnShare').onclick=async()=>{
  const url=location.origin+location.pathname+'#k='+encode();
  try{ await navigator.clipboard.writeText(url); toast('공유 링크를 복사했어요'); }
  // 클립보드가 막히는 환경은 네이티브 prompt도 같이 막히는 경우가 많다 → 인앱 모달로 보여준다
  catch(e){ await askText('이 링크를 복사하세요', url); }
};

/* 대기 중인 클라우드 쓰기를 놓치지 않기 위한 안전망 — 디바운스 타이머를
   기다리지 않고 앱이 백그라운드로 가거나 닫히는 순간 즉시 내보낸다.
   모바일은 앱 전환이 잦아 pagehide 없이 visibilitychange만 오는 경우가 흔하다. */
window.addEventListener('pagehide', ()=>{ flushCloudSave(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden') flushCloudSave();
});

/* PWA — 서비스워커 등록. file://로 열었을 때는 시도하지 않는다(개발 중 콘솔 오염 방지) */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js', {scope:'./'})
      .catch(e=>console.warn('서비스워커 등록 실패', e));
  });
}

(async function init(){
  if(sb){
    try{ const {data}=await sb.auth.getSession(); session=data.session||null; }
    catch(e){ session=null; }
  }
  renderAuth();

  const saved=await Store.get(KEY);
  if(saved) Object.assign(S,saved);
  // 공유 링크는 생년월일을 직접 실어 나르므로 개월수 고정을 푼다
  if(location.hash.startsWith('#k=')&&decode(location.hash.slice(3))){ S.checked={}; S.ageOverride=null; }
  renderAuth();                       // Store.get에서 nickname을 받아왔을 수 있다
  renderPresets(); render();          // 먼저 폴백을 그려 빈 화면을 안 보여준다
  loadKits();                         // 로그인 상태면 내 임무 목록을 채운다
  loadPublicKits();                   // 공개 임무가 있으면 PRESETS 자리를 대체한다

  // 로그인/로그아웃되면 저장소가 바뀐다 → 다시 읽어서 그리기
  if(sb) sb.auth.onAuthStateChange((event, s)=>{
    const before = session && session.user ? session.user.id : null;
    session = s || null;
    if(!session) nickname='';
    const after = session && session.user ? session.user.id : null;
    renderAuth();
    if(before === after) return;      // INITIAL_SESSION·토큰 갱신은 무시
    // supabase-js 콜백 안에서 바로 다른 호출을 하지 않도록 한 틱 미룬다
    setTimeout(async()=>{
      const data=await Store.get(KEY);
      if(data) Object.assign(S,data);
      else if(session) await Store.set(KEY,S);   // 첫 로그인 — 쓰던 상태를 올려둔다
      renderAuth(); render();
      await loadKits();                          // 로그아웃이면 목록을 비우고 섹션을 숨긴다
      await loadPublicKits();                    // 별점 입력 가능 여부가 로그인 상태에 따라 달라진다
    },0);
  });
})();
</script>
